[package]
name = "rdp-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/111inhistory/lsw-rdp-launcher"

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
rpassword = "7"
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
base64 = "0.23.1"
serde_json = "1.0.151"
url = "2.5"
