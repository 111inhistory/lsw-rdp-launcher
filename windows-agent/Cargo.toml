[package]
name = "remoteapp-launcher"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/111inhistory/lsw-rdp-launcher"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
